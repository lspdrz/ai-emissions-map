[project]
name = "ai-emissions-map"
version = "0.1.0"
description = "Carbon scores for AI serving routes and location-disclosure ratings for providers"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "ecologits==0.11.2",
    "requests>=2.32",
]

[dependency-groups]
browser = [
    "playwright>=1.47",
]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ecologits: runs the real pinned EcoLogits package",
    "browser: drives headless Chromium (uv sync --group browser && uv run playwright install chromium)",
]
