[project]
name = "ai-emissions-map"
version = "0.1.0"
description = "Carbon scores for AI serving routes and location-disclosure ratings for providers"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "ecologits==0.11.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ecologits: runs the real pinned EcoLogits package"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aem"]
