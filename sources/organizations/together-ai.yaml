name: together-ai
display_name: Together AI
description: >-
  Together AI says it runs open models on its own infrastructure, in data centers it describes only by region: the
  United States, and France, the Netherlands, Sweden and Romania in Europe. It does not say which of them serves its
  serverless API, and its documentation offers no region choice there beyond United States processing for selected
  models at us-api.together.ai.
type: inference_host
homepage: https://www.together.ai
country: US
ids:
  ossd: null
  hf_provider: together
  openrouter: together
contact:
  url: https://www.together.ai/contact
comments: >-
  The legal entity is Together Computer, Inc. (its privacy policy), based in San Francisco. No serving-locations file
  is published (https://www.together.ai/.well-known/ai-serving-locations.json returns 404). Its data center page lists
  capacity by region ("Europe 150 MW+ available in Europe: France, Netherlands, Sweden, and Romania") without saying
  which serves serverless inference, and its privacy and security documentation says "DeepSeek models are hosted in
  Together's secure North America data centers" and that passthrough models are forwarded to the upstream provider.
  Only the serverless API is recorded: its default endpoint and, for the seven models that offer it, the US-only
  endpoint (us-api.together.ai). The default routes of DeepSeek draw on the United States as a whole, and those of the
  other models record no location, since nothing says where the serverless endpoint runs. Dedicated endpoints are not
  recorded: Together's API names the regions a customer can pin one to (such as us-east-3) but no state, province,
  country or site, so no grid follows from them. Passthrough models are not recorded.

