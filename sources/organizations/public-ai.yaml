name: public-ai
display_name: Public AI
description: >-
  Public AI's Inference Utility routes each request to an inference partner's compute. Its pages say only that its
  inference partners host models "worldwide"; its open-source deployment configuration names the partner behind each
  model, and most of those partners name no site.
type: inference_host
homepage: https://publicai.co
ids: { ossd: null, hf_provider: publicai, openrouter: null }
contact: { url: https://publicai.co/about }
comments: >-
  The Public AI Inference Utility, a nonprofit project. It publishes no serving-locations file
  (https://publicai.co/.well-known/ai-serving-locations.json returns 404). Its gateway "routes requests to open-source
  models hosted by inference partners worldwide" and handles "load balancing, traffic routing, and failover", so it
  decides where a request runs and is recorded as the organization serving it; each route's location is its
  partners'. Only the models in its public model catalog are recorded, by the weights its deployment configuration
  serves: the catalog's two thinking variants are a flag on the base models, and its apertus-v1.5-8b is served by
  Jülich as the older Apertus-8B-Instruct-2509. Public AI's partners change the model behind a name often, so each
  route cites the commit of the configuration read. Models its configuration sends to commercial APIs (Mistral,
  Hugging Face's router, OpenRouter, Bedrock) are not in the catalog and are not recorded.

