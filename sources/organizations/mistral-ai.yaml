name: mistral-ai
display_name: Mistral AI
description: >-
  Mistral AI serves its models from a global endpoint, with no commitment to where a request runs, and from regional
  endpoints in the European Union and the United States. Its subprocessor list names the countries of its own
  infrastructure and of its inference provider, but not the buildings.
type: model_lab
homepage: https://mistral.ai
country: FR
ids: { ossd: null, hf_provider: null, openrouter: mistral }
contact: { url: https://mistral.ai/contact }
comments: >-
  Only the global endpoint (api.mistral.ai) is recorded. Mistral also offers regional endpoints, api.eu.mistral.ai
  ("Multiple data centers in EU and EFTA countries") and api.us.mistral.ai ("Multiple data centers in the United
  States"), but says "Available models vary by region" and publishes which models each serves only through the
  models.list API, which needs an account. A disclosure rating rests on what is public, so no regional route is
  recorded until Mistral publishes which models each region serves. Vibe (formerly Le Chat), its assistant, is not
  recorded.

# Generated by `python -m build score`. Everything below this line is rewritten on each run; do not edit it by hand.
disclosure_rating:
  letter: C
  mean: 1.0
  spread:
    C: 3
  summary: C (3 routes at C)
