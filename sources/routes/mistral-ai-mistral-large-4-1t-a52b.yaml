comments: >-
  The global endpoint, api.mistral.ai, used unless the customer sends requests to a regional one. Mistral makes no
  commitment to where it runs, so the candidates are every place Mistral's subprocessor list says its models run:
  Mistral Compute, its own infrastructure, in France, and CoreWeave, its "Inference Provider", in the "EEA". Mistral
  names no CoreWeave site, so the EEA is taken as CoreWeave's own sites there, in Sweden, Norway, Denmark and Spain;
  its UK sites are outside the EEA. Each country is a whole-country grid, since no bidding zone is named. The list's
  Microsoft entry (Sweden and Norway, "Cloud Infrastructure") is not counted, since it does not say it runs inference,
  and its Google entry is for the US endpoint only. The Trust Center is rendered by JavaScript; it was read in a
  browser. The help center's statement is about where data is stored, and agrees with the candidates.

