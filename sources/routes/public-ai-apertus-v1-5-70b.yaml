comments: >-
  The Public AI Inference Utility's API. Public AI's deployment configuration has two active partners for the model,
  Infomaniak and PHOENIQS, and its developer overview says endpoints sharing a model name are load-balanced, so a
  request may run on either. Public AI's own gateway and chat run on AWS in Zurich, which is not where the model runs.
  Infomaniak says its AI services run in its data centers in Switzerland, and PHOENIQS says its model service, the one
  at maas.phoeniqs.com, is "hosted entirely on Swiss sovereign infrastructure", with its data centre in Basel, so the
  route draws on Switzerland's grid. The configuration changes often: until 14:49 UTC on 9 November 2026 a third
  partner, Featherless, which names no location, was also active (commit 874a798), and in October 2026 only PHOENIQS
  was; the evidence cites the commit read.

