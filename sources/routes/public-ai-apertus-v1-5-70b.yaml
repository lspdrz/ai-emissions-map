comments: >-
  The Public AI Inference Utility's API. Public AI's pages say only that its compute providers are "all over the
  world"; its open-source deployment configuration, a public repository needing no account, sends every production
  request for the model to PHOENIQS's model service (maas.phoeniqs.com), with the other partners commented out. The
  configuration changes often: the model was served by Infomaniak until it moved to PHOENIQS between 12 and 18
  October 2026, so the evidence cites the commits read. PHOENIQS runs data centers only in Switzerland, and its uptownBasel AI facility is recorded as the one
  serving Apertus, as the maintainer decided, from PHOENIQS's announcement that it makes Apertus available on that
  infrastructure. The "openai/" prefix in the configuration is LiteLLM's API format, not OpenAI. The FAQ's answer is
  read from the page's script, where its text is kept.

