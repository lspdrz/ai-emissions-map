  sub-processors' countries. The sub-processors' US and Canadian sites are not named, so they draw on the United States
  and Canada as a whole. The sub-processor list does not include Spain, though the regions page lists eu-south1
  (Madrid) as public; it is kept as a candidate. Woodbury draws on MISO, whose grid file carries Iowa's value, not
  Minnesota's. Served in FP8 (the catalog's "quantization"); this does not change the parameter counts. Dedicated
  endpoints, which a customer deploys in a chosen region, are not recorded.

