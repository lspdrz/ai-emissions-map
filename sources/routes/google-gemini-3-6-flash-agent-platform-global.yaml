comments: >-
  The Agent Platform's global endpoint (formerly Vertex AI). Google lists no regions for Gemini 3.6 Flash and says a
  global request may be processed in any Google Cloud location, so the candidates are every Google Cloud region in
  sources/snapshots/cloud_regions.csv. Regions the table skips for having no grid zone (europe-north2, europe-west10,
  northamerica-south1, us-central2, us-east2) are not candidates. The table maps me-central1, which Google places in
  Doha, Qatar, to the United Arab Emirates' zone; it is kept as the table gives it. The Agent Platform has no default
  endpoint: every request names one, so no route is marked default.

