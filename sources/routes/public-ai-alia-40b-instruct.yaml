comments: >-
  The Public AI Inference Utility's API, which also serves its chat (as alia-salamandra:40b). Public AI's deployment
  configuration sends the model to Nextbit, a Spanish company that says it serves the models marked "UE" in its catalog
  from its own hardware in Spain, ALIA-40B among them ("the whole catalog runs from the EU by default; what runs
  outside is marked in the table"). Its DPA describes api.nextbit256.com as a global endpoint with inference outside
  the EEA, and its FAQ links that endpoint to the models marked "Multi"; the catalog's marking for ALIA is credited, and
  the conflict is recorded in the evidence. Nextbit names no data center, so the route draws on Spain's grid. Which
  ALIA instruct release Nextbit serves is not stated; all have the same parameter counts.

