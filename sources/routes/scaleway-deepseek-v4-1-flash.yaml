comments: >-
  Generative APIs Serverless, at api.scaleway.ai. Scaleway says every Serverless model is hosted in one Paris data
  center operated by OPCORE, and the public catalog lists the model in the fr-par region, but Scaleway lists four Paris
  data centers (DC2, DC3, DC4 and DC5) and does not say which one. DC5 is recorded, as the maintainer decided: Scaleway
  says its GPU products are available in DC5 (par2), and its footprint method for Generative APIs gives DC5 as the
  example of the data center hosting a model. Scaleway buys guarantees of origin for its data centers; the score uses
  France's grid, since the method is location-based. Scaleway lists the model in preview. It does not say at what
  precision Serverless runs it; precision does not change the parameter counts.

