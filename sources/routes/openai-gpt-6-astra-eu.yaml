comments: >-
  The OpenAI API through eu.api.openai.com, with regional processing in Europe (EEA and Switzerland). OpenAI
  names no region or facility, so the candidates are the countries in the EEA and Switzerland where its
  sub-processor list says its cloud-infrastructure providers process customer data for the API; the list
  narrows OpenAI's commitment and sets no location on its own. Italy, Norway, Sweden and Denmark are whole
  countries split into bidding zones. The sub-processor list renders only with JavaScript and was read in
  headless Chrome.
  OpenAI's sentence on EU data residency with Standard, Flex and Batch processing does not name GPT-6 Astra,
  but its endpoint table lists it for processing in Europe with no exception, and Fast mode is the only
  processing OpenAI says it lacks there.

