comments: >-
  DeepSeek states the counts for DeepSeek-V4.1-Flash; the 1017 card gives none of its own and calls itself a minor
  update, with the same architecture in its config. Active is the 16B per token during decode, since the score is per
  output token (8B during prefill). Total is the 552B backbone; the card also describes "Engram conditional memory (196B
  parameters, sparsely accessed via token-based lookup)", not counted here, and Hugging Face counts 763.2B parameters
  in the 1017 safetensors, the backbone, the Engram memory and the vision encoder together.
