comments: >-
  DeepSeek states 552B backbone parameters, with 8B active per token during prefill and 16B during decode. Output
  tokens are generated in decode, so the active count is 16B. The total is the backbone alone: the model also has a
  196B Engram conditional memory, accessed by lookup rather than computed, which is not counted. Hugging Face counts
  763B parameters in the safetensors, backbone and Engram together. The same counts as DeepSeek-V4.1-Flash-1017's, a
  minor update of this model.
